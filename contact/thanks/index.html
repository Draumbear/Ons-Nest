<!doctype html>
<html lang="nl">
<head>
<meta charset="utf-8">
<title>Bericht verzonden — Ons Nest</title>
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, follow">
<meta name="theme-color" content="#25475A">
<link rel="icon" href="/icons/favicon.ico" sizes="32x32">
<link rel="icon" href="/icons/favicon-16.png" type="image/png" sizes="16x16">
<link rel="icon" href="/icons/favicon-32.png" type="image/png" sizes="32x32">
<link rel="apple-touch-icon" href="/icons/apple-touch-icon.png" sizes="180x180">
<style>
  :root{ --sand:#F5F0E4; --ink:#232A2E; --ink-soft:#4C565C; --sea:#3C6B82; --sea-deep:#284A5C; }
  @media (prefers-color-scheme: dark){
    :root{ --sand:#141C22; --ink:#EDE7DA; --ink-soft:#B7C1C6; --sea:#7FB3CC; --sea-deep:#9FCBDF; }
  }
  *{box-sizing:border-box;}
  html,body{margin:0;padding:0;height:100%;}
  body{
    background:var(--sand); color:var(--ink);
    font-family: Georgia, "Iowan Old Style", "Palatino Linotype", Palatino, serif;
    display:flex; align-items:center; justify-content:center; min-height:100vh;
    padding:8vh 6vw; text-align:center; -webkit-font-smoothing:antialiased;
  }
  .sans{font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Helvetica, Arial, sans-serif;}
  .kicker{font-size:0.74rem; letter-spacing:0.22em; text-transform:uppercase; color:var(--sea); margin-bottom:14px;}
  h1{font-size:clamp(1.7rem, 3.4vw, 2.2rem); margin:0 0 14px;}
  p{color:var(--ink-soft); font-size:1rem; margin:0 0 30px;}
  a.btn{
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Helvetica, Arial, sans-serif;
    display:inline-block; padding:12px 24px; border-radius:2px; background:var(--sea-deep);
    color:var(--sand); text-decoration:none; font-size:0.9rem; font-weight:600;
  }
</style>
</head>
<body>
  <div>
    <span class="kicker">Ons Nest</span>
    <h1>Bericht verzonden.</h1>
    <p>Bedankt voor je bericht — we nemen snel contact met je op.</p>
    <a class="btn sans" href="/">Terug naar Ons Nest</a>
  </div>

<script>
(function () {
  var lang = ((navigator.language || "unknown").split("-")[0] || "unknown").toLowerCase();
  function send(evt) {
    try {
      var payload = JSON.stringify({ path: location.pathname, lang: lang, event: evt });
      if (navigator.sendBeacon) {
        navigator.sendBeacon("/.netlify/functions/track", new Blob([payload], { type: "application/json" }));
      } else {
        fetch("/.netlify/functions/track", { method: "POST", headers: { "content-type": "application/json" }, body: payload, keepalive: true });
      }
    } catch (e) {}
  }
  send("visit");
  document.querySelectorAll(".interhome-link").forEach(function (a) {
    a.addEventListener("click", function () { send("commission-click"); });
  });
})();
</script>
</body>
</html>
